<!-- ═══════════════ VISITOR COUNTER (added — nothing above this line was touched) ═══════════════ -->
<style>
  #site-visitor-stats{
    margin:36px auto 20px;padding:14px 12px 0;max-width:640px;
    border-top:1px solid var(--line-soft, var(--edge-soft, rgba(255,255,255,.07)));
    text-align:center;line-height:1.9;
    font-family:var(--data, ui-monospace, SFMono-Regular, monospace);
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted,#8f88b8);opacity:.55;
  }
  #site-visitor-stats p{margin:0}
  #site-visitor-stats b{font-weight:500;font-variant-numeric:tabular-nums}
  #site-visitor-stats[data-state="off"] .vc-counts{display:none}
  @media (max-width:520px){#site-visitor-stats{font-size:9.5px;letter-spacing:.1em}}
</style>

<footer id="site-visitor-stats" data-state="loading">
  <p class="vc-copy">© 2026 Gomamon</p>
  <p class="vc-counts">Visitors · Today <b id="vc-today">–</b> · Week <b id="vc-week">–</b> · All time <b id="vc-all">–</b></p>
</footer>

<script>
/* ── Real visitor counter ──────────────────────────────────────────────────────
   Backend: Abacus (https://abacus.jasoncameron.dev) — a free, open-source,
   no-account, no-cookie counting API. Counts live on their server, so they are
   shared across every user and device.
   localStorage is used ONLY to remember whether THIS browser has already been
   counted for today / this week / ever, so a refresh does not add a visit.
   Everything is wrapped in try/catch and runs after `load`; if the API is down
   the numbers simply hide and the rest of the page is unaffected.          */
(function(){
  "use strict";
  if (typeof window.fetch !== "function") return;

  var NS    = "game-gomamon.github.io";                 // change if you fork the site

  /* PAGE identifies THIS url. Counts and the "already counted" flags are both
     keyed by it, so every page gets its own tally and one person browsing
     several pages is counted once per page instead of once per site. */
  var PAGE  = (function(){
    var s = (location.hostname + location.pathname)
              .replace(/index\.html?$/i, "")
              .replace(/[^a-zA-Z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "")
              .toLowerCase();
    return s.slice(0, 38) || "root";
  })();
  var HOSTS = ["https://abacus.jasoncameron.dev", "https://abacus.jsn.cam"];

  function pad(n){ return (n < 10 ? "0" : "") + n; }

  /* UTC so every visitor rolls over at the same instant */
  function dayKey(d){
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
  }
  function weekKey(d){
    var t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));   // ISO-8601: Thursday of this week
    var jan1 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    var week = Math.ceil((((t - jan1) / 86400000) + 1) / 7);
    return t.getUTCFullYear() + "-W" + pad(week);
  }

  /* localStorage when allowed, in-memory fallback for private mode */
  var store = (function(){
    try {
      var probe = "__vc_probe";
      localStorage.setItem(probe, "1"); localStorage.removeItem(probe);
      return localStorage;
    } catch (e) {
      var mem = {};
      return {
        getItem: function(k){ return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
        setItem: function(k, v){ mem[k] = String(v); }
      };
    }
  })();

  function call(path){
    var i = 0;
    function attempt(){
      return fetch(HOSTS[i] + path, { cache: "no-store", mode: "cors", credentials: "omit" })
        .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(j){ return (j && typeof j.value === "number") ? j.value : null; })
        .catch(function(){ i += 1; return (i < HOSTS.length) ? attempt() : null; });
    }
    return attempt();
  }

  /* /hit = count this browser once for the period, /get = read only */
  function track(counter, stamp, flag){
    var seen = null;
    try { seen = store.getItem(flag); } catch (e) {}
    var isNew = (seen !== stamp);
    return call((isNew ? "/hit/" : "/get/") + NS + "/" + counter).then(function(value){
      if (isNew && value !== null) { try { store.setItem(flag, stamp); } catch (e) {} }
      return value;
    });
  }

  function paint(id, value){
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = (value === null) ? "–" : Number(value).toLocaleString();
  }

  function run(){
    var now = new Date(), day = dayKey(now), week = weekKey(now);
    Promise.all([
      track("v-" + PAGE + "-d-" + day,   day,  "vc.seen.day."   + PAGE),
      track("v-" + PAGE + "-w-" + week,  week, "vc.seen.week."  + PAGE),
      track("v-" + PAGE + "-total",      "all","vc.seen.total." + PAGE)
    ]).then(function(v){
      var box = document.getElementById("site-visitor-stats");
      paint("vc-today", v[0]); paint("vc-week", v[1]); paint("vc-all", v[2]);
      if (box) box.setAttribute("data-state",
        (v[0] === null && v[1] === null && v[2] === null) ? "off" : "ready");
    }).catch(function(){
      var box = document.getElementById("site-visitor-stats");
      if (box) box.setAttribute("data-state", "off");
    });
  }

  function start(){
    if (window.requestIdleCallback) { requestIdleCallback(run, { timeout: 2500 }); } else { setTimeout(run, 400); }
  }
  if (document.readyState === "complete") { start(); }
  else { window.addEventListener("load", start); }
})();
</script>
